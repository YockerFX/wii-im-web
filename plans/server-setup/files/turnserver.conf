# coturn – statische Härtung, identisch für dev/prod.
# Server-spezifisches (realm, listening-ip, relay-ip, static-auth-secret, log-file) kommt per CLI aus compose.yaml/.env.
listening-port=3478
min-port=49152
max-port=50175
# Auth: TURN REST API (zeitlich begrenzte HMAC-Credentials, Username "ablauf:userid")
use-auth-secret
fingerprint
stale-nonce=600
max-allocate-lifetime=3600
# Quotas / Bandbreite (Missbrauchsschutz; Sensordaten brauchen ~7 KB/s pro Session)
user-quota=12
total-quota=800
max-bps=250000
bps-capacity=12500000
# Kein TLS im MVP (kein Zertifikat nötig; DTLS und CLI sind seit coturn 4.17 standardmäßig aus) – TURN/TLS siehe Plan 09
no-tls
# WebRTC braucht kein TCP-Relay (RFC 6062)
no-tcp-relay
no-multicast-peers
no-software-attribute
pidfile=/tmp/turnserver.pid
# gegen STUN-Amplification
no-rfc5780
response-origin-only-with-rfc5780
# Relay ins interne Netz verbieten: Docker-Bridge, RFC1918, CGNAT, Link-Local (Hetzner-Metadaten 169.254.169.254), Loopback, Test-/Multicast-Netze, IPv6-Pendants
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
